name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"

permissions:
  contents: write   # sürüm (Release) yayınlamak için

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          $base = (Select-String -Path core/version.py -Pattern '__version__ = "(\d+)\.(\d+)\.').Matches[0].Groups
          $v = "$($base[1].Value).$($base[2].Value).${{ github.run_number }}"
          (Get-Content core/version.py -Raw) -replace '__version__ = "[^"]+"', "__version__ = `"$v`"" | Set-Content core/version.py -Encoding utf8
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build app
        run: pyinstaller --noconfirm --clean medquiz.spec

      - name: Self-test packaged app (real Windows machine)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install reportlab
          python tools/make_test_book.py test_book.pdf 600
          $p = Start-Process -FilePath "dist\MedQuiz\MedQuiz.exe" -ArgumentList "--selftest","--pdf","test_book.pdf","--out","selftest.json" -Wait -PassThru
          python tools/annotate_selftest.py selftest.json $p.ExitCode
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed"; exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss

      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path dist\MedQuiz -DestinationPath MedQuiz_Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MedQuiz-Windows
          path: |
            installer_output/MedQuiz_Kurulum.exe
            MedQuiz_Portable.zip
            selftest.json

      - name: Publish release (uygulama içi güncelleme bunu kullanır)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $hash = (Get-FileHash installer_output/MedQuiz_Kurulum.exe -Algorithm SHA256).Hash.ToLower()
          $msg = (git log -1 --pretty=%B) -join "`n"
          $notes = "$msg`n`n---`nsha256: $hash"
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create "v$v" installer_output/MedQuiz_Kurulum.exe --title "MedQuiz $v" --notes-file notes.md --latest
